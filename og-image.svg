<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="-71" cy="224" r="55" fill="#1d4ed8" opacity="0.09"/>
    <circle cx="-77" cy="499" r="98" fill="#1d4ed8" opacity="0.16"/>
    <circle cx="523" cy="395" r="99" fill="#1d4ed8" opacity="0.19"/>
    <circle cx="960" cy="186" r="87" fill="#1d4ed8" opacity="0.10"/>
    <circle cx="471" cy="88" r="34" fill="#1d4ed8" opacity="0.08"/>
    <circle cx="1046" cy="249" r="36" fill="#1d4ed8" opacity="0.11"/>
    <rect x="1105" y="381" width="37" height="81" rx="8" fill="#2563eb" opacity="0.12" transform="rotate(38, 265, 224)"/>
    <rect x="120" y="360" width="99" height="91" rx="8" fill="#2563eb" opacity="0.05" transform="rotate(44, 665, 519)"/>
    <rect x="565" y="725" width="36" height="20" rx="8" fill="#2563eb" opacity="0.15" transform="rotate(1, 380, 301)"/>
    <rect x="417" y="246" width="90" height="64" rx="8" fill="#2563eb" opacity="0.14" transform="rotate(27, 1003, 461)"/>
    <rect x="560" y="526" width="64" height="82" rx="8" fill="#2563eb" opacity="0.09" transform="rotate(21, 1282, 289)"/>
    <rect x="905" y="673" width="76" height="28" rx="8" fill="#2563eb" opacity="0.10" transform="rotate(10, 1101, 24)"/>
    <rect x="654" y="263" width="84" height="35" rx="8" fill="#2563eb" opacity="0.07" transform="rotate(18, 1257, 661)"/>
    <rect x="499" y="578" width="29" height="62" rx="8" fill="#2563eb" opacity="0.04" transform="rotate(17, 1273, 213)"/>
    <polygon points="1112,221 1155,307 1069,307" fill="#1d4ed8" opacity="0.07"/>
    <polygon points="782,188 872,368 692,368" fill="#1d4ed8" opacity="0.03"/>
    <polygon points="146,215 182,287 110,287" fill="#1d4ed8" opacity="0.08"/>
    <polygon points="334,84 409,234 259,234" fill="#1d4ed8" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,548 C360,589 840,507 1200,548 L1200,630 L0,630Z" fill="#1d4ed8" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    상수 룸싸롱 가격
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    상수 — 룸싸롱
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f59e0b" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    상수 상수 룸싸롱 가격 — 룸싸롱
  </text>
</svg>